zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 6354a56f3b0f5693de07bd6bcdd1db21
      name: 'Templates/Applications'
  templates:
    - uuid: a0c8aacdd15e3451aa96d9596ca30853
      template: 'V380 Decoder by HTTP'
      name: 'V380 Decoder by HTTP'
      description: 'V380Decoder authenticated metrics API; 1 HTTP request per poll with dependent JSONPath items. One Zabbix host per decoder instance.'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: f5812e0538c82ec1f480cc397d1bb87f
          name: 'V380: metrics JSON'
          type: HTTP_AGENT
          key: v380.metrics.raw
          delay: '{$V380.UPDATE.INTERVAL}'
          history: 1d
          value_type: TEXT
          timeout: 5s
          url: '{$V380.SCHEME}://{HOST.CONN}:{$V380.HTTP.PORT}/api/metrics'
          authtype: BASIC
          username: '{$V380.USER}'
          password: '{$V380.PASSWORD}'
          status_codes: '200'
          tags:
            - tag: component
              value: http
          triggers:
            - uuid: c136bedd0921e92922c0c521674ca5a7
              expression: 'nodata(/V380 Decoder by HTTP/v380.metrics.raw,2m)=1'
              name: 'V380: monitoring API has no data for 2 minutes'
              priority: HIGH
        - uuid: 10ffcc218fc0c5053cf050ad4c6b684b
          name: 'V380: Schema version'
          type: DEPENDENT
          key: v380.schema_version
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.schema_version'
          master_item:
            key: v380.metrics.raw
          tags:
            - tag: component
              value: system
        - uuid: 0e2d920bb41600cf592c35a7348d4a91
